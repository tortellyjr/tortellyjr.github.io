<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <!_-link rel="stylesheet" href="assets/style/grid6.css"-->
        <title>Card Jogos Linha</title>
        <!--script src="assets/script/grid6.js"></script-->
    </head>
    <body>
        <style>
        *{
            font-family: sans-serif;
            letter-spacing: 1px;
        }
        main{
            padding-top: 1rem;
        }
        img{
            margin: 0px;
        }
        article{
          display: flex;
          border: solid 0px red;
          background-color: #023246;
          border-radius: 0.3rem;
          color: white;
          padding: 0.5rem;
          gap: 0.5rem;
          justify-content: center;
        }
        article span{
          font-size: 0.8rem;
        }
        .campeonato{
          border: solid 0px blue;
          flex: 1;
          display: flex;
          justify-content: left;
          align-items: center;
        }
        .campeonato span{
          color: darkgoldenrod;
          font-size: 0.7rem;
        }
        .jogo{
          border: solid 0px green;
          display: flex;
          gap: 1rem;
          flex: 3;
        }
        .jogo span{
          align-self: center;
          text-align: center;
        }
        .jogo span:first-of-type{
          align-self: center;
          flex: 1;
          text-align: end;
          font-weight: lighter;
        }
        .jogo span:last-of-type{
          align-self: center;
          flex: 1;
          text-align: start;
          font-weight: lighter;
        }
        .data{
          border: solid 0px black;
          flex: 1;
          display: flex;
          justify-content: right;
          align-items: center;
        }
        .data span{
          border: solid 0px white;
          text-align: right;
          font-size: 0.7rem;
          color: #888888;
        }
        </style>
        <main>
            <article>
              <div class="campeonato"><span>Brasileirão</span></div>
              <div class="jogo"><span>Flamengo</span><span>2</span><span>X</span><span>0</span><span>Mirassol</span></div>
              <div class="data"><span>10 Out 2026</span></div>
            </article>
            <br>
            <article>
              <div class="campeonato"><span>Copa do Brasil</span></div>
              <div class="jogo"><span>independiente del Valle</span><span>X</span><span>São Paulo</span></div>
              <div class="data"><span>10 Out 2026</span></div>
            </article>
        </main>
    </body>
</html>
